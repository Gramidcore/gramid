<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Gram ID — Connect TON Wallet</title>

  <script src="https://unpkg.com/@tonconnect/ui@2.0.9/dist/tonconnect-ui.min.js"></script>

  <style>
    :root {
      --text: #f5f7fb;
      --muted: #98a2b3;
      --muted-2: #687384;

      --border: rgba(255, 255, 255, 0.12);
      --panel: rgba(8, 11, 17, 0.72);

      --blue: #6d9dff;
      --purple: #8b73ff;
      --success: #70e0a3;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;

      color: var(--text);

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background:
        linear-gradient(
          rgba(4, 6, 10, 0.72),
          rgba(4, 6, 10, 0.86)
        ),
        url("./background.png")
        center / cover
        fixed
        no-repeat;

      overflow-x: hidden;
    }

    body::before {
      content: "";

      position: fixed;
      inset: 0;

      pointer-events: none;

      background:
        radial-gradient(
          600px 500px at 50% 0%,
          rgba(92, 143, 255, 0.14),
          transparent 70%
        ),

        radial-gradient(
          500px 500px at 100% 100%,
          rgba(139, 115, 255, 0.1),
          transparent 70%
        );
    }

    .page {
      min-height: 100vh;

      display: flex;
      flex-direction: column;
    }

    .topbar {
      width: 100%;
      max-width: 1180px;

      margin: 0 auto;
      padding: 30px 28px;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      color: #ffffff;

      font-size: 21px;
      font-weight: 700;

      letter-spacing: -0.06em;
    }

    .network {
      color: var(--muted-2);

      font-size: 10px;
      font-weight: 700;

      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .main {
      flex: 1;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 50px 20px 90px;
    }

    .card {
      width: 100%;
      max-width: 520px;

      padding: 46px 42px;

      border: 1px solid var(--border);
      border-radius: 30px;

      background:
        linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.08),
          rgba(255, 255, 255, 0.025)
        ),
        var(--panel);

      box-shadow:
        0 40px 120px rgba(0, 0, 0, 0.52),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);

      backdrop-filter: blur(28px);
    }

    .status-pill {
      width: fit-content;

      display: flex;
      align-items: center;
      gap: 8px;

      margin-bottom: 30px;
      padding: 8px 13px;

      border: 1px solid var(--border);
      border-radius: 999px;

      color: #b4bdcc;

      background: rgba(255, 255, 255, 0.035);

      font-size: 11px;
      font-weight: 600;
    }

    .status-dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: var(--success);

      box-shadow:
        0 0 15px rgba(112, 224, 163, 0.8);
    }

    h1 {
      margin: 0;

      font-size: clamp(42px, 7vw, 66px);
      line-height: 0.98;

      letter-spacing: -0.08em;
    }

    .gradient {
      color: transparent;

      background:
        linear-gradient(
          135deg,
          #ffffff,
          #b7c8ff 48%,
          #78aaff
        );

      -webkit-background-clip: text;
      background-clip: text;
    }

    .description {
      max-width: 430px;

      margin: 25px 0 0;

      color: var(--muted);

      font-size: 16px;
      line-height: 1.7;
    }

    .wallet-section {
      margin-top: 38px;
      padding-top: 28px;

      border-top: 1px solid var(--border);
    }

    .wallet-label {
      margin-bottom: 14px;

      color: var(--muted-2);

      font-size: 10px;
      font-weight: 700;

      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    #ton-connect-button {
      min-height: 52px;
    }

    /*
      Настраиваем стандартную кнопку TON Connect
    */

    #ton-connect-button button {
      width: 100% !important;
      min-height: 52px !important;

      border-radius: 14px !important;

      font-family: inherit !important;
      font-size: 14px !important;
      font-weight: 600 !important;

      background:
        linear-gradient(
          135deg,
          var(--blue),
          var(--purple)
        ) !important;

      box-shadow:
        0 16px 45px rgba(91, 118, 255, 0.28) !important;
    }

    #ton-connect-button button:hover {
      transform: translateY(-1px);

      background:
        linear-gradient(
          135deg,
          #7aa8ff,
          #9984ff
        ) !important;
    }

    .connected {
      display: none;

      margin-top: 18px;
      padding: 18px;

      border: 1px solid rgba(112, 224, 163, 0.25);
      border-radius: 16px;

      background: rgba(112, 224, 163, 0.06);
    }

    .connected-title {
      color: var(--success);

      font-size: 13px;
      font-weight: 700;
    }

    .connected-address {
      margin-top: 9px;

      color: #cbd6e5;

      font-family: monospace;
      font-size: 12px;

      word-break: break-all;
    }

    .continue-button {
      width: 100%;

      min-height: 48px;

      margin-top: 16px;

      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 13px;

      color: white;

      background: rgba(255, 255, 255, 0.06);

      cursor: pointer;

      font-family: inherit;
      font-size: 13px;
      font-weight: 600;

      transition:
        background 0.2s ease,
        transform 0.2s ease;
    }

    .continue-button:hover {
      transform: translateY(-1px);

      background: rgba(255, 255, 255, 0.11);
    }

    .security {
      display: flex;
      justify-content: center;
      gap: 18px;

      margin-top: 28px;

      color: var(--muted-2);

      font-size: 11px;
    }

    .footer {
      padding: 24px;

      color: var(--muted-2);

      font-size: 11px;

      text-align: center;
    }

    @media (max-width: 600px) {
      .topbar {
        padding: 24px 18px;
      }

      .network {
        display: none;
      }

      .main {
        padding:
          25px
          15px
          60px;
      }

      .card {
        padding: 32px 24px;

        border-radius: 24px;
      }

      .security {
        flex-direction: column;

        align-items: center;

        gap: 8px;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <header class="topbar">

      <div class="brand">
        Gram ID
      </div>

      <div class="network">
        TON IDENTITY
      </div>

    </header>


    <main class="main">

      <section class="card">

        <div class="status-pill">

          <span class="status-dot"></span>

          TON Network

        </div>


        <h1>

          Connect your

          <br />

          <span class="gradient">
            TON wallet.
          </span>

        </h1>


        <p class="description">

          Your wallet is the foundation of your digital identity.
          Connect it to continue with Gram ID.

        </p>


        <div class="wallet-section">

          <div class="wallet-label">
            Wallet connection
          </div>


          <div id="ton-connect-button"></div>


          <div
            class="connected"
            id="connected"
          >

            <div class="connected-title">
              ✓ TON wallet connected
            </div>


            <div
              class="connected-address"
              id="wallet-address"
            ></div>


            <button
              class="continue-button"
              onclick="continueToNextStep()"
            >

              Continue

            </button>

          </div>

        </div>


        <div class="security">

          <span>
            Secure
          </span>

          <span>
            Non-custodial
          </span>

          <span>
            TON-native
          </span>

        </div>

      </section>

    </main>


    <footer class="footer">

      Gram ID · Identity infrastructure for TON

    </footer>

  </div>


  <script>

    const tonConnectUI =
      new TON_CONNECT_UI.TonConnectUI({

        manifestUrl:
          "./tonconnect-manifest.json",

        buttonRootId:
          "ton-connect-button"

      });


    const connectedBox =
      document.getElementById(
        "connected"
      );


    const walletAddress =
      document.getElementById(
        "wallet-address"
      );


    tonConnectUI.onStatusChange(
      function(wallet) {

        if (wallet) {

          const address =
            wallet.account.address;


          walletAddress.textContent =
            address;


          connectedBox.style.display =
            "block";

        }

        else {

          connectedBox.style.display =
            "none";

          walletAddress.textContent =
            "";

        }

      }

    );


    async function continueToNextStep() {

      const wallet =
        tonConnectUI.wallet;


      if (!wallet) {

        return;

      }


      /*
        Следующим этапом сюда добавим
        переход к Telegram-подтверждению.

        Пока просто сохраняем адрес
        для следующего шага.
      */

      localStorage.setItem(

        "gramid_wallet_address",

        wallet.account.address

      );


      alert(
        "TON wallet connected successfully"
      );

    }

  </script>

</body>
</html>
