<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GramID — Web3 Identity for TON</title>

  <script src="https://unpkg.com/@tonconnect/ui@2.0.9/dist/tonconnect-ui.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0f19;
      color: white;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 80px 20px;
      text-align: center;
    }

    .logo {
      font-size: 52px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .subtitle {
      font-size: 22px;
      color: #aab2c5;
      margin-bottom: 50px;
    }

    .card {
      max-width: 500px;
      margin: auto;
      padding: 30px;
      border: 1px solid #283044;
      border-radius: 20px;
      background: #121827;
    }

    .card h2 {
      margin-top: 0;
    }

    .wallet {
      margin-top: 25px;
      display: flex;
      justify-content: center;
    }

    .features {
      margin-top: 60px;
      display: grid;
      gap: 15px;
    }

    .feature {
      padding: 20px;
      border-radius: 14px;
      background: #121827;
      border: 1px solid #283044;
    }

    .footer {
      margin-top: 60px;
      color: #697386;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">GramID</div>

    <div class="subtitle">
      Your identity layer for TON
    </div>

    <div class="card">

      <h2>Build your Web3 identity</h2>

      <p>
        Connect your TON wallet, verify ownership
        and create your decentralized identity.
      </p>

      <div class="wallet">
        <div id="ton-connect"></div>
      </div>

    </div>

    <div class="features">

      <div class="feature">
        🔐 Secure wallet-based identity
      </div>

      <div class="feature">
        🌐 TON domain integration
      </div>

      <div class="feature">
        🚀 Built for the TON ecosystem
      </div>

    </div>

    <div class="footer">
      GramID — decentralized identity for the next generation of Web3
    </div>

  </div>

  <script>
    const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
      manifestUrl: 'https://gramidcore.github.io/gramid/tonconnect-manifest.json',
      buttonRootId: 'ton-connect'
    });
  </script>

</body>
</html>
