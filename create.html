<!DOCTYPE html>

<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Gram ID — Create</title>

  <script src="https://unpkg.com/@tonconnect/ui@2.0.9/dist/tonconnect-ui.min.js"></script>

  <style>
    :root {
      --text: #f5f7fb;
      --muted: #9aa3b2;
      --muted-soft: #687281;
      --border: rgba(255, 255, 255, 0.12);
      --blue: #6d9dff;
      --purple: #8d76ff;
      --success: #72dfa5;
      --danger: #ff7f8a;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;

      color: var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Inter,
        sans-serif;

      background:
        linear-gradient(
          rgba(4, 6, 10, 0.70),
          rgba(4, 6, 10, 0.88)
        ),
        url("./background.png")
        center / cover
        fixed
        no-repeat;

      overflow-x: hidden;
    }

    body::after {
      content: "";

      position: fixed;
      inset: 0;

      pointer-events: none;

      background:
        radial-gradient(
          700px 500px at 50% 0%,
          rgba(95, 157, 255, 0.13),
          transparent 70%
        );

      z-index: -1;
    }

    .page {
      min-height: 100vh;

      display: flex;
      flex-direction: column;
    }

    .header {
      width: 100%;
      max-width: 1200px;

      margin: 0 auto;
      padding: 32px 36px;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      color: #ffffff;

      font-size: 21px;
      font-weight: 700;

      letter-spacing: -0.055em;
    }

    .header-label {
      color: var(--muted-soft);

      font-size: 10px;
      font-weight: 700;

      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .main {
      flex: 1;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 60px 24px 100px;
    }

    .content {
      width: 100%;
      max-width: 560px;

      text-align: center;
    }

    .step {
      margin-bottom: 24px;

      color: var(--muted-soft);

      font-size: 11px;
      font-weight: 700;

      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;

      font-size: clamp(42px, 7vw, 68px);

      line-height: 1;

      font-weight: 700;

      letter-spacing: -0.08em;
    }

    .gradient {
      color: transparent;

      background:
        linear-gradient(
          135deg,
          #ffffff 0%,
          #b8c8ff 45%,
          #79aaff 100%
        );

      -webkit-background-clip: text;
      background-clip: text;
    }

    .description {
      max-width: 480px;

      margin: 26px auto 0;

      color: var(--muted);

      font-size: 17px;

      line-height: 1.7;
    }

    .create-card {
      width: 100%;

      margin-top: 38px;

      padding: 24px;

      border:
        1px solid
        var(--border);

      border-radius: 18px;

      background:
        rgba(255, 255, 255, 0.035);

      text-align: left;

      backdrop-filter: blur(18px);
    }

    .label {
      display: block;

      margin-bottom: 10px;

      color: #b7c0cf;

      font-size: 12px;
      font-weight: 600;
    }

    .username-wrapper {
      display: flex;
      align-items: center;

      width: 100%;

      border:
        1px solid
        rgba(255, 255, 255, 0.14);

      border-radius: 13px;

      background:
        rgba(0, 0, 0, 0.18);

      overflow: hidden;
    }

    .username-prefix {
      padding-left: 16px;

      color: var(--muted);

      font-size: 16px;
      font-weight: 600;
    }

    #username {
      width: 100%;

      min-height: 52px;

      padding: 0 14px;

      border: 0;
      outline: 0;

      color: white;

      background: transparent;

      font-family: inherit;

      font-size: 16px;
    }

    #username::placeholder {
      color: var(--muted-soft);
    }

    .hint {
      margin-top: 10px;

      color: var(--muted-soft);

      font-size: 11px;

      line-height: 1.5;
    }

    .wallet-status {
      display: flex;

      align-items: center;

      gap: 8px;

      margin-top: 22px;

      padding: 12px 14px;

      border:
        1px solid
        rgba(114, 223, 165, 0.22);

      border-radius: 12px;

      color: var(--success);

      background:
        rgba(114, 223, 165, 0.06);

      font-size: 12px;
    }

    .wallet-dot {
      width: 7px;
      height: 7px;

      flex-shrink: 0;

      border-radius: 50%;

      background: var(--success);

      box-shadow:
        0 0 12px
        rgba(114, 223, 165, 0.8);
    }

    .wallet-address {
      margin-left: auto;

      max-width: 210px;

      color: #cbd5e3;

      font-family: monospace;

      font-size: 10px;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;
    }

    .create-button {
      width: 100%;

      min-height: 52px;

      margin-top: 18px;

      border: 0;

      border-radius: 14px;

      color: white;

      background:
        linear-gradient(
          135deg,
          var(--blue),
          var(--purple)
        );

      cursor: pointer;

      font-family: inherit;

      font-size: 14px;

      font-weight: 600;

      box-shadow:
        0 18px 50px
        rgba(92, 119, 255, 0.25);
    }

    .create-button:hover {
      transform: translateY(-1px);
    }

    .message {
      min-height: 20px;

      margin-top: 14px;

      font-size: 12px;

      text-align: center;
    }

    .message.error {
      color: var(--danger);
    }

    .message.success {
      color: var(--success);
    }

    .footer {
      padding: 24px;

      color: var(--muted-soft);

      font-size: 11px;

      text-align: center;
    }

    @media (max-width: 600px) {

      .header {
        padding: 24px 20px;
      }

      .header-label {
        display: none;
      }

      .main {
        padding: 45px 18px 70px;
      }

      .description {
        font-size: 16px;
      }

      .create-card {
        padding: 20px;
      }

      .wallet-address {
        max-width: 130px;
      }

    }
  </style>

</head>

<body>

  <div class="page">

```
<header class="header">

  <div class="brand">
    Gram ID
  </div>

  <div class="header-label">
    Web3 Identity
  </div>

</header>


<main class="main">

  <section class="content">

    <div class="step">
      Step 01 · Identity
    </div>


    <h1>

      Создайте

      <br>

      <span class="gradient">
        Gram ID.
      </span>

    </h1>


    <p class="description">

      Выберите уникальное имя для своей
      цифровой идентичности в экосистеме TON.

    </p>


    <div class="create-card">

      <label
        class="label"
        for="username"
      >

        Ваш Gram ID

      </label>


      <div class="username-wrapper">

        <span class="username-prefix">
          @
        </span>


        <input
          id="username"
          type="text"
          maxlength="24"
          placeholder="username"
          autocomplete="off"
        >

      </div>


      <div class="hint">

        Используйте от 3 до 24 символов.
        Только латинские буквы, цифры и символ "_".

      </div>


      <div
        class="wallet-status"
        id="wallet-status"
      >

        <span class="wallet-dot"></span>

        <span id="wallet-status-text">
          TON-кошелёк подключён
        </span>

        <span
          class="wallet-address"
          id="wallet-address"
        ></span>

      </div>


      <button
        class="create-button"
        id="create-button"
      >

        Создать Gram ID

      </button>


      <div
        class="message"
        id="message"
      ></div>

    </div>

  </section>

</main>


<footer class="footer">

  Gram ID · Digital identity for Web3

</footer>
```

  </div>

  <script>

    const tonConnectUI =
      new TON_CONNECT_UI.TonConnectUI({

        manifestUrl:
          "https://gramidcore.github.io/gramid/tonconnect-manifest.json"

      });


    const usernameInput =
      document.getElementById(
        "username"
      );


    const createButton =
      document.getElementById(
        "create-button"
      );


    const message =
      document.getElementById(
        "message"
      );


    const walletAddress =
      document.getElementById(
        "wallet-address"
      );


    const walletStatusText =
      document.getElementById(
        "wallet-status-text"
      );


    let currentWallet = null;


    const savedWalletAddress =
      localStorage.getItem(
        "gramid_wallet_address"
      );


    if (savedWalletAddress) {

      walletAddress.textContent =
        savedWalletAddress;

    }


    tonConnectUI.onStatusChange(

      function(wallet) {

        if (!wallet) {

          return;

        }


        currentWallet =
          wallet;


        const address =
          wallet.account.address;


        walletAddress.textContent =
          address;


        walletStatusText.textContent =
          "TON-кошелёк подключён";


        localStorage.setItem(
          "gramid_wallet_address",
          address
        );

      }

    );


    createButton.addEventListener(

      "click",

      function() {

        const username =
          usernameInput.value
            .trim()
            .toLowerCase();


        const validUsername =
          /^[a-z0-9_]{3,24}$/;


        if (
          !validUsername.test(
            username
          )
        ) {

          message.textContent =
            "Введите корректный Gram ID.";

          message.className =
            "message error";

          return;

        }


        const wallet =
          currentWallet ||
          tonConnectUI.wallet;


        if (!wallet) {

          message.textContent =
            "TON-кошелёк ещё не подключён.";

          message.className =
            "message error";

          return;

        }


        const gramId =
          "@" + username;


        localStorage.setItem(
          "gramid_username",
          gramId
        );


        localStorage.setItem(
          "gramid_wallet_address",
          wallet.account.address
        );


        message.textContent =
          "Gram ID создан. Переходим в профиль...";

        message.className =
          "message success";


        setTimeout(

          function() {

            window.location.replace(
              "./profile.html"
            );

          },

          700

        );

      }

    );

  </script>

</body>
</html>
