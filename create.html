<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Create Gram ID — Gram ID</title>

  <style>
    :root {
      --text: #f5f7fb;
      --muted: #9aa3b2;
      --muted-soft: #687281;

      --border: rgba(255, 255, 255, 0.12);

      --blue: #6d9dff;
      --purple: #8d76ff;

      --success: #72dfa5;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;

      color: var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Inter,
        sans-serif;

      background:
        linear-gradient(
          rgba(4, 6, 10, 0.70),
          rgba(4, 6, 10, 0.88)
        ),

        url("./background.png")
        center / cover
        fixed
        no-repeat;

      overflow-x: hidden;
    }

    body::after {
      content: "";

      position: fixed;

      inset: 0;

      pointer-events: none;

      background:
        radial-gradient(
          700px 500px at 50% 0%,
          rgba(95, 157, 255, 0.13),
          transparent 70%
        );
    }

    .page {
      min-height: 100vh;

      display: flex;

      flex-direction: column;
    }

    .header {
      width: 100%;

      max-width: 1200px;

      margin: 0 auto;

      padding:
        32px
        36px;

      display: flex;

      align-items: center;

      justify-content: space-between;
    }

    .brand {
      color: #ffffff;

      font-size: 21px;

      font-weight: 700;

      letter-spacing: -0.055em;
    }

    .header-label {
      color: var(--muted-soft);

      font-size: 10px;

      font-weight: 700;

      letter-spacing: 0.16em;

      text-transform: uppercase;
    }

    .main {
      flex: 1;

      display: flex;

      align-items: center;

      justify-content: center;

      padding:
        60px
        24px
        100px;
    }

    .content {
      width: 100%;

      max-width: 620px;

      text-align: center;
    }

    .step {
      margin-bottom: 28px;

      color: var(--muted-soft);

      font-size: 11px;

      font-weight: 700;

      letter-spacing: 0.14em;

      text-transform: uppercase;
    }

    h1 {
      margin: 0;

      font-size:
        clamp(
          44px,
          7vw,
          72px
        );

      line-height: 1;

      font-weight: 700;

      letter-spacing: -0.08em;
    }

    .gradient {
      color: transparent;

      background:
        linear-gradient(
          135deg,
          #ffffff 0%,
          #b8c8ff 45%,
          #79aaff 100%
        );

      -webkit-background-clip: text;

      background-clip: text;
    }

    .description {
      max-width: 520px;

      margin:
        28px
        auto
        0;

      color: var(--muted);

      font-size: 17px;

      line-height: 1.7;
    }

    .card {
      margin:
        42px
        auto
        0;

      padding: 26px;

      border:
        1px solid
        var(--border);

      border-radius: 22px;

      background:
        rgba(255, 255, 255, 0.045);

      box-shadow:
        0 25px 80px
        rgba(0, 0, 0, 0.30);

      backdrop-filter: blur(20px);

      text-align: left;
    }

    .label {
      display: block;

      margin-bottom: 10px;

      color: var(--muted-soft);

      font-size: 11px;

      font-weight: 700;

      letter-spacing: 0.12em;

      text-transform: uppercase;
    }

    .id-input-wrapper {
      display: flex;

      align-items: center;

      width: 100%;

      height: 58px;

      border:
        1px solid
        rgba(255, 255, 255, 0.14);

      border-radius: 14px;

      background:
        rgba(0, 0, 0, 0.20);

      overflow: hidden;
    }

    .id-input {
      flex: 1;

      min-width: 0;

      height: 100%;

      padding:
        0
        18px;

      border: 0;

      outline: none;

      color: #ffffff;

      background: transparent;

      font-family: inherit;

      font-size: 17px;

      font-weight: 600;
    }

    .id-input::placeholder {
      color: #667181;
    }

    .suffix {
      padding-right: 18px;

      color: #91a5c4;

      font-size: 15px;

      font-weight: 600;

      white-space: nowrap;
    }

    .availability {
      min-height: 22px;

      margin-top: 12px;

      color: var(--muted);

      font-size: 13px;
    }

    .availability.available {
      color: var(--success);
    }

    .availability.taken {
      color: #ff8d9b;
    }

    .wallet-box {
      margin-top: 18px;

      padding:
        16px
        18px;

      border:
        1px solid
        rgba(114, 223, 165, 0.20);

      border-radius: 14px;

      background:
        rgba(114, 223, 165, 0.055);
    }

    .wallet-title {
      color: var(--success);

      font-size: 12px;

      font-weight: 700;
    }

    .wallet-address {
      margin-top: 8px;

      color: #bfc9d8;

      font-family: monospace;

      font-size: 11px;

      line-height: 1.5;

      word-break: break-all;
    }

    .continue-button {
      width: 100%;

      min-height: 52px;

      margin-top: 18px;

      border: 0;

      border-radius: 14px;

      color: #ffffff;

      background:
        linear-gradient(
          135deg,
          var(--blue),
          var(--purple)
        );

      box-shadow:
        0 18px 50px
        rgba(92, 119, 255, 0.28);

      cursor: pointer;

      font-family: inherit;

      font-size: 14px;

      font-weight: 600;

      transition:
        transform 0.2s ease,
        opacity 0.2s ease;
    }

    .continue-button:hover {
      transform: translateY(-1px);
    }

    .continue-button:disabled {
      opacity: 0.45;

      cursor: not-allowed;

      transform: none;
    }

    .footer {
      padding: 24px;

      color: var(--muted-soft);

      font-size: 11px;

      text-align: center;
    }

    @media (max-width: 600px) {

      .header {
        padding:
          24px
          20px;
      }

      .header-label {
        display: none;
      }

      .main {
        padding:
          50px
          18px
          80px;
      }

      .card {
        padding: 20px;
      }

      .suffix {
        padding-right: 14px;

        font-size: 13px;
      }

    }
  </style>
</head>

<body>

  <div class="page">

    <header class="header">

      <div class="brand">
        Gram ID
      </div>

      <div class="header-label">
        Web3 Identity
      </div>

    </header>


    <main class="main">

      <section class="content">

        <div class="step">
          Шаг 2 из 3
        </div>


        <h1>

          Создайте свой

          <br>

          <span class="gradient">
            Gram ID.
          </span>

        </h1>


        <p class="description">

          Выберите уникальное имя для своей цифровой идентичности
          в экосистеме TON.

        </p>


        <div class="card">

          <label
            class="label"
            for="gramIdInput"
          >

            Ваш Gram ID

          </label>


          <div class="id-input-wrapper">

            <input
              class="id-input"
              id="gramIdInput"
              type="text"
              placeholder="username"
              autocomplete="off"
              maxlength="24"
            >


            <div class="suffix">

              .gramid.ton

            </div>

          </div>


          <div
            class="availability"
            id="availability"
          >

            Введите имя от 3 до 24 символов

          </div>


          <div
            class="wallet-box"
            id="walletBox"
          >

            <div class="wallet-title">

              ✓ TON-кошелёк подключён

            </div>


            <div
              class="wallet-address"
              id="walletAddress"
            ></div>

          </div>


          <button
            class="continue-button"
            id="continueButton"
            disabled
            onclick="continueToTelegram()"
          >

            Продолжить

          </button>

        </div>

      </section>

    </main>


    <footer class="footer">

      Gram ID · Digital identity for Web3

    </footer>

  </div>


  <script>

    const input =
      document.getElementById(
        "gramIdInput"
      );


    const availability =
      document.getElementById(
        "availability"
      );


    const continueButton =
      document.getElementById(
        "continueButton"
      );


    const walletAddress =
      document.getElementById(
        "walletAddress"
      );


    const wallet =
      localStorage.getItem(
        "gramid_wallet_address"
      );


    if (wallet) {

      walletAddress.textContent =
        wallet;

    } else {

      walletAddress.textContent =
        "Кошелёк не найден";

    }


    input.addEventListener(
      "input",
      function() {

        const value =
          input.value
            .trim()
            .toLowerCase();


        input.value =
          value.replace(
            /[^a-z0-9_]/g,
            ""
          );


        if (
          value.length < 3
        ) {

          availability.textContent =
            "Введите имя от 3 до 24 символов";

          availability.className =
            "availability";

          continueButton.disabled =
            true;

          return;

        }


        if (
          value.length > 24
        ) {

          availability.textContent =
            "Максимальная длина — 24 символа";

          availability.className =
            "availability taken";

          continueButton.disabled =
            true;

          return;

        }


        availability.textContent =
          "✓ Имя доступно";

        availability.className =
          "availability available";


        continueButton.disabled =
          false;

      }
    );


    function continueToTelegram() {

      const gramId =
        input.value
          .trim()
          .toLowerCase();


      if (
        gramId.length < 3
      ) {

        return;

      }


      localStorage.setItem(
        "gramid_username",

        gramId
      );


      window.location.href =
        "telegram.html";

    }

  </script>

</body>
</html>
