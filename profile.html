<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Gram ID Profile</title>

  <style>

    :root {
      --text: #f5f7fb;
      --muted: #9aa3b2;
      --muted-soft: #687281;

      --border: rgba(255, 255, 255, 0.12);

      --blue: #6d9dff;
      --purple: #8d76ff;

      --success: #72dfa5;
    }


    * {
      box-sizing: border-box;
    }


    html,
    body {
      margin: 0;

      min-height: 100%;
    }


    body {

      min-height: 100vh;

      color: var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Inter,
        sans-serif;

      background:

        linear-gradient(
          rgba(4, 6, 10, 0.70),
          rgba(4, 6, 10, 0.88)
        ),

        url("./background.png")
        center / cover
        fixed
        no-repeat;

      overflow-x: hidden;
    }


    body::after {

      content: "";

      position: fixed;

      inset: 0;

      pointer-events: none;

      background:

        radial-gradient(
          700px 500px at 50% 0%,
          rgba(95, 157, 255, 0.13),
          transparent 70%
        );

      z-index: -1;
    }


    .page {

      min-height: 100vh;

      display: flex;

      flex-direction: column;
    }


    .header {

      width: 100%;

      max-width: 1200px;

      margin: 0 auto;

      padding:
        32px
        36px;

      display: flex;

      align-items: center;

      justify-content: space-between;
    }


    .brand {

      color: #ffffff;

      font-size: 21px;

      font-weight: 700;

      letter-spacing: -0.055em;
    }


    .header-label {

      color: var(--muted-soft);

      font-size: 10px;

      font-weight: 700;

      letter-spacing: 0.16em;

      text-transform: uppercase;
    }


    .main {

      flex: 1;

      display: flex;

      align-items: center;

      justify-content: center;

      padding:
        50px
        20px
        90px;
    }


    .profile-card {

      width: 100%;

      max-width: 620px;

      padding: 42px;

      border:
        1px solid
        var(--border);

      border-radius: 28px;

      background:

        linear-gradient(
          145deg,
          rgba(255,255,255,0.075),
          rgba(255,255,255,0.025)
        ),

        rgba(12, 15, 22, 0.82);

      box-shadow:

        0 30px 100px
        rgba(0,0,0,0.45),

        inset 0 1px 0
        rgba(255,255,255,0.04);

      backdrop-filter: blur(26px);
    }


    .profile-top {

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 20px;
    }


    .verified {

      display: inline-flex;

      align-items: center;

      gap: 8px;

      color: var(--success);

      font-size: 11px;

      font-weight: 700;

      letter-spacing: 0.12em;

      text-transform: uppercase;
    }


    .verified-dot {

      width: 7px;

      height: 7px;

      border-radius: 50%;

      background: var(--success);

      box-shadow:
        0 0 15px
        rgba(114, 223, 165, 0.85);
    }


    .profile-label {

      color: var(--muted-soft);

      font-size: 11px;

      font-weight: 700;

      letter-spacing: 0.12em;

      text-transform: uppercase;
    }


    .identity {

      margin-top: 42px;
    }


    .identity-name {

      font-size: 48px;

      line-height: 1;

      font-weight: 700;

      letter-spacing: -0.075em;

      word-break: break-word;
    }


    .identity-id {

      margin-top: 14px;

      color: transparent;

      background:

        linear-gradient(
          135deg,
          #ffffff,
          #9bb7ff,
          #8d76ff
        );

      -webkit-background-clip: text;

      background-clip: text;

      font-size: 22px;

      font-weight: 700;

      letter-spacing: 0.04em;
    }


    .telegram {

      margin-top: 12px;

      color: #8db5ff;

      font-size: 15px;
    }


    .divider {

      height: 1px;

      margin:
        34px
        0;

      background:
        rgba(255,255,255,0.08);
    }


    .data-title {

      margin-bottom: 14px;

      color: var(--muted-soft);

      font-size: 11px;

      font-weight: 700;

      letter-spacing: 0.12em;

      text-transform: uppercase;
    }


    .data-box {

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 14px;

      padding:
        16px
        18px;

      border:
        1px solid
        rgba(255,255,255,0.08);

      border-radius: 14px;

      background:
        rgba(255,255,255,0.035);
    }


    .data-content {

      min-width: 0;
    }


    .data-label {

      color: var(--muted-soft);

      font-size: 10px;

      font-weight: 700;

      letter-spacing: 0.08em;

      text-transform: uppercase;
    }


    .data-value {

      margin-top: 8px;

      color: #dbe4f1;

      font-family: monospace;

      font-size: 12px;

      line-height: 1.5;

      word-break: break-all;
    }


    .copy-button {

      flex-shrink: 0;

      padding:
        9px
        12px;

      border:
        1px solid
        rgba(255,255,255,0.13);

      border-radius: 10px;

      color: #dbe5f4;

      background:
        rgba(255,255,255,0.045);

      cursor: pointer;

      font-family: inherit;

      font-size: 12px;

      font-weight: 600;
    }


    .copy-button:hover {

      background:
        rgba(255,255,255,0.10);
    }


    .actions {

      display: grid;

      grid-template-columns:
        1fr
        1fr;

      gap: 12px;

      margin-top: 28px;
    }


    .button {

      min-height: 48px;

      border-radius: 13px;

      cursor: pointer;

      font-family: inherit;

      font-size: 13px;

      font-weight: 600;

      transition:
        transform 0.2s ease,
        background 0.2s ease;
    }


    .button:hover {

      transform: translateY(-1px);
    }


    .primary {

      border: none;

      color: white;

      background:

        linear-gradient(
          135deg,
          var(--blue),
          var(--purple)
        );

      box-shadow:

        0 15px 40px
        rgba(92,119,255,0.24);
    }


    .secondary {

      border:
        1px solid
        rgba(255,255,255,0.13);

      color: #dbe4f1;

      background:
        rgba(255,255,255,0.055);
    }


    .status {

      min-height: 20px;

      margin-top: 18px;

      color: var(--muted);

      font-size: 13px;

      text-align: center;
    }


    .footer {

      padding: 24px;

      color: var(--muted-soft);

      font-size: 11px;

      text-align: center;
    }


    @media (max-width: 600px) {

      .header {

        padding:
          24px
          20px;
      }


      .header-label {

        display: none;
      }


      .main {

        padding:
          40px
          16px
          70px;
      }


      .profile-card {

        padding: 25px;

        border-radius: 22px;
      }


      .identity-name {

        font-size: 38px;
      }


      .identity-id {

        font-size: 18px;
      }


      .actions {

        grid-template-columns: 1fr;
      }

    }

  </style>
</head>


<body>


  <div class="page">


    <header class="header">


      <div class="brand">

        Gram ID

      </div>


      <div class="header-label">

        Web3 Identity

      </div>


    </header>


    <main class="main">


      <section class="profile-card">


        <div class="profile-top">


          <div class="verified">


            <span class="verified-dot"></span>


            Verified identity


          </div>


          <div class="profile-label">

            Gram ID Profile

          </div>


        </div>


        <div class="identity">


          <div
            class="identity-name"
            id="profileName"
          >

          </div>


          <div
            class="identity-id"
            id="gramId"
          >

          </div>


          <div
            class="telegram"
            id="telegram"
          >

          </div>


        </div>


        <div class="divider"></div>


        <div class="data-title">

          Connected wallet

        </div>


        <div class="data-box">


          <div class="data-content">


            <div class="data-label">

              TON Address

            </div>


            <div
              class="data-value"
              id="walletAddress"
            >

            </div>


          </div>


          <button
            class="copy-button"
            onclick="copyWallet()"
          >

            Copy

          </button>


        </div>


        <div class="actions">


          <button
            class="button primary"
            onclick="goToCreate()"
          >

            Edit profile

          </button>


          <button
            class="button secondary"
            onclick="goHome()"
          >

            На главную

          </button>


        </div>


        <div
          class="status"
          id="status"
        ></div>


      </section>


    </main>


    <footer class="footer">

      Gram ID · Digital identity for Web3

    </footer>


  </div>


  <script>


    const profileData =

      JSON.parse(

        localStorage.getItem(

          "gramid_profile"

        )

      );


    const savedGramId =

      localStorage.getItem(

        "gramid_id"

      );


    const profileName =

      document.getElementById(

        "profileName"

      );


    const gramId =

      document.getElementById(

        "gramId"

      );


    const telegram =

      document.getElementById(

        "telegram"

      );


    const walletAddress =

      document.getElementById(

        "walletAddress"

      );


    const status =

      document.getElementById(

        "status"

      );


    if (!profileData) {

      window.location.href =
        "create.html";

    }


    if (profileData) {


      profileName.textContent =

        profileData.name ||

        "Gram ID User";


      gramId.textContent =

        profileData.gram_id ||

        savedGramId ||

        "GID-UNKNOWN";


      if (

        profileData.telegram_username

      ) {


        telegram.textContent =

          profileData.telegram_username

            .startsWith("@")

            ? profileData.telegram_username

            : "@" +
              profileData.telegram_username;


      } else {


        telegram.textContent =

          "Telegram не привязан";

      }


      walletAddress.textContent =

        profileData.wallet_address ||

        "Wallet not found";

    }


    function copyWallet() {


      if (

        !profileData ||

        !profileData.wallet_address

      ) {

        return;

      }


      navigator.clipboard.writeText(

        profileData.wallet_address

      );


      status.textContent =

        "Адрес кошелька скопирован ✓";


    }


    function goToCreate() {


      window.location.href =

        "create.html";

    }


    function goHome() {


      window.location.href =

        "index.html";

    }

  </script>


</body>

</html>
