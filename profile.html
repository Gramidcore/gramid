<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GramID Profile</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #0b0f19;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .profile-card {
      width: 100%;
      max-width: 520px;
      padding: 35px;
      text-align: center;
      background: #121827;
      border: 1px solid #283044;
      border-radius: 24px;
    }

    .logo {
      font-size: 38px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .verified {
      color: #16a085;
      font-size: 14px;
      margin-bottom: 30px;
    }

    .avatar {
      width: 90px;
      height: 90px;
      margin: auto;
      border-radius: 50%;
      background: #229ed9;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      font-weight: bold;
    }

    .name {
      margin-top: 22px;
      font-size: 30px;
      font-weight: bold;
    }

    .domain {
      margin-top: 8px;
      color: #229ed9;
      font-size: 18px;
    }

    .wallet-box {
      margin-top: 28px;
      padding: 18px;
      background: #0b0f19;
      border: 1px solid #283044;
      border-radius: 14px;
    }

    .label {
      color: #697386;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }

    .wallet {
      font-family: monospace;
      color: #aab2c5;
      word-break: break-all;
      font-size: 14px;
    }

    .back-button {
      display: inline-block;
      margin-top: 28px;
      padding: 12px 20px;
      border-radius: 10px;
      background: #283044;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    .error {
      color: #ff7777;
      line-height: 1.6;
    }
  </style>
</head>

<body>

  <div class="profile-card">

    <div class="logo">
      GramID
    </div>

    <div class="verified">
      ✓ VERIFIED WEB3 IDENTITY
    </div>

    <div
      class="avatar"
      id="avatar">
      G
    </div>

    <div
      class="name"
      id="name">
      Loading...
    </div>

    <div
      class="domain"
      id="domain">
    </div>

    <div class="wallet-box">

      <div class="label">
        Verified TON Wallet
      </div>

      <div
        class="wallet"
        id="wallet">
      </div>

    </div>

    <a
      class="back-button"
      href="index.html">
      Create Your GramID
    </a>

  </div>


  <script>

    const SUPABASE_URL =
      'https://beuymvtrabmawogqrhni.supabase.co';

    const SUPABASE_KEY =
      'sb_publishable_WHFBkb-8c_iDJ2uBG9g2TQ_CSMkumUg';


    const params =
      new URLSearchParams(
        window.location.search
      );


    const walletAddress =
      params.get('wallet');


    function shortAddress(address) {

      return address.slice(0, 8) +
        '...' +
        address.slice(-8);

    }


    async function loadProfile() {

      if (!walletAddress) {

        document
          .getElementById('name')
          .innerHTML =
          '<div class="error">Profile wallet address is missing.</div>';

        return;

      }


      const response =
        await fetch(

          SUPABASE_URL +
          '/rest/v1/profiles' +

          '?wallet_address=eq.' +

          encodeURIComponent(
            walletAddress
          ) +

          '&select=*',

          {

            method: 'GET',

            headers: {

              'apikey':
                SUPABASE_KEY,

              'Authorization':
                'Bearer ' +
                SUPABASE_KEY

            }

          }

        );


      if (!response.ok) {

        document
          .getElementById('name')
          .innerHTML =
          '<div class="error">Unable to load profile.</div>';

        return;

      }


      const profiles =
        await response.json();


      if (profiles.length === 0) {

        document
          .getElementById('name')
          .innerHTML =
          '<div class="error">Profile not found.</div>';

        return;

      }


      const profile =
        profiles[0];


      document
        .getElementById('name')
        .textContent =
        profile.name;


      document
        .getElementById('domain')
        .textContent =
        profile.domain ||
        'TON domain not added';


      document
        .getElementById('wallet')
        .textContent =
        shortAddress(
          profile.wallet_address
        );


      document
        .getElementById('avatar')
        .textContent =
        profile.name
          .charAt(0)
          .toUpperCase();

    }


    loadProfile();

  </script>

</body>
</html>
