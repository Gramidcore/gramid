<!DOCTYPE html>

<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Gram ID — Profile</title>

  <script src="https://unpkg.com/@tonconnect/ui@2.0.9/dist/tonconnect-ui.min.js"></script>

  <style>
    :root {
      --text: #f5f7fb;
      --muted: #9aa3b2;
      --muted-soft: #687281;
      --border: rgba(255, 255, 255, 0.12);
      --blue: #6d9dff;
      --purple: #8d76ff;
      --success: #72dfa5;
      --danger: #ff7f8a;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;

      color: var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Inter,
        sans-serif;

      background:
        linear-gradient(
          rgba(4, 6, 10, 0.70),
          rgba(4, 6, 10, 0.88)
        ),
        url("./background.png")
        center / cover
        fixed
        no-repeat;

      overflow-x: hidden;
    }

    body::after {
      content: "";

      position: fixed;
      inset: 0;

      pointer-events: none;

      background:
        radial-gradient(
          700px 500px at 50% 0%,
          rgba(95, 157, 255, 0.13),
          transparent 70%
        );

      z-index: -1;
    }

    .page {
      min-height: 100vh;

      display: flex;
      flex-direction: column;
    }

    .header {
      width: 100%;
      max-width: 1200px;

      margin: 0 auto;
      padding: 32px 36px;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      color: #ffffff;

      font-size: 21px;
      font-weight: 700;

      letter-spacing: -0.055em;
    }

    .header-label {
      color: var(--muted-soft);

      font-size: 10px;
      font-weight: 700;

      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .main {
      flex: 1;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 60px 24px 100px;
    }

    .content {
      width: 100%;
      max-width: 560px;

      text-align: center;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;

      margin-bottom: 24px;
      padding: 9px 14px;

      border: 1px solid
        rgba(114, 223, 165, 0.25);

      border-radius: 999px;

      color: var(--success);

      background:
        rgba(114, 223, 165, 0.06);

      font-size: 11px;
      font-weight: 600;
    }

    .status-dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: var(--success);

      box-shadow:
        0 0 14px
        rgba(114, 223, 165, 0.8);
    }

    h1 {
      margin: 0;

      font-size: clamp(48px, 8vw, 76px);

      line-height: 0.98;

      font-weight: 700;

      letter-spacing: -0.085em;
    }

    .gradient {
      color: transparent;

      background:
        linear-gradient(
          135deg,
          #ffffff 0%,
          #b8c8ff 45%,
          #79aaff 100%
        );

      -webkit-background-clip: text;
      background-clip: text;
    }

    .description {
      max-width: 470px;

      margin: 26px auto 0;

      color: var(--muted);

      font-size: 17px;

      line-height: 1.7;
    }

    .profile-card {
      width: 100%;

      margin-top: 38px;

      padding: 24px;

      border:
        1px solid
        var(--border);

      border-radius: 18px;

      background:
        rgba(255, 255, 255, 0.035);

      text-align: left;

      backdrop-filter: blur(18px);
    }

    .profile-row {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 20px;

      padding: 16px 0;

      border-bottom:
        1px solid
        rgba(255, 255, 255, 0.08);
    }

    .profile-row:last-child {
      border-bottom: 0;
    }

    .profile-label {
      color: var(--muted-soft);

      font-size: 12px;
    }

    .profile-value {
      max-width: 280px;

      color: #ffffff;

      font-size: 14px;
      font-weight: 600;

      text-align: right;

      word-break: break-word;
    }

    .wallet-value {
      color: #cbd5e3;

      font-family: monospace;

      font-size: 11px;

      font-weight: 400;
    }

    .logout-button {
      width: 100%;

      min-height: 48px;

      margin-top: 18px;

      border:
        1px solid
        rgba(255, 127, 138, 0.25);

      border-radius: 13px;

      color: var(--danger);

      background:
        rgba(255, 127, 138, 0.06);

      cursor: pointer;

      font-family: inherit;

      font-size: 13px;
      font-weight: 600;
    }

    .logout-button:hover {
      background:
        rgba(255, 127, 138, 0.11);
    }

    .footer {
      padding: 24px;

      color: var(--muted-soft);

      font-size: 11px;

      text-align: center;
    }

    @media (max-width: 600px) {

      .header {
        padding: 24px 20px;
      }

      .header-label {
        display: none;
      }

      .main {
        padding: 45px 18px 70px;
      }

      .profile-card {
        padding: 20px;
      }

      .profile-row {
        align-items: flex-start;
        flex-direction: column;
        gap: 7px;
      }

      .profile-value {
        max-width: 100%;

        text-align: left;
      }

    }
  </style>

</head>

<body>

  <div class="page">

```

  </div>

  <script>

    const tonConnectUI =
      new TON_CONNECT_UI.TonConnectUI({

        manifestUrl:
          "https://gramidcore.github.io/gramid/tonconnect-manifest.json"

      });


    const username =
      localStorage.getItem(
        "gramid_username"
      );


    const usernameTitle =
      document.getElementById(
        "username"
      );


    const profileUsername =
      document.getElementById(
        "profile-username"
      );


    const walletAddress =
      document.getElementById(
        "wallet-address"
      );


    const logoutButton =
      document.getElementById(
        "logout-button"
      );


    if (!username) {

      window.location.href =
        "create.html";

    } else {

      usernameTitle.textContent =
        username;

      profileUsername.textContent =
        username;

    }


    tonConnectUI.onStatusChange(

      function(wallet) {

        if (!wallet) {

          window.location.href =
            "index.html";

          return;

        }


        walletAddress.textContent =
          wallet.account.address;

      }

    );


    logoutButton.addEventListener(

      "click",

      async function() {

        await tonConnectUI.disconnect();


        localStorage.removeItem(
          "gramid_username"
        );


        localStorage.removeItem(
          "gramid_wallet_address"
        );


        window.location.href =
          "index.html";

      }

    );

  </script>

</body>
</html>
