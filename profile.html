<!DOCTYPE html>

<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Gram ID — Profile</title>

  <script src="https://unpkg.com/@tonconnect/ui@2.0.9/dist/tonconnect-ui.min.js"></script>

  <style>
    :root {
      --text: #f5f7fb;
      --muted: #9aa3b2;
      --muted-soft: #687281;
      --border: rgba(255, 255, 255, 0.12);
      --blue: #6d9dff;
      --purple: #8d76ff;
      --success: #72dfa5;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;

      color: var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Inter,
        sans-serif;

      background:
        linear-gradient(
          rgba(4, 6, 10, 0.70),
          rgba(4, 6, 10, 0.88)
        ),
        url("./background.png")
        center / cover
        fixed
        no-repeat;

      overflow-x: hidden;
    }

    body::after {
      content: "";

      position: fixed;
      inset: 0;

      pointer-events: none;

      background:
        radial-gradient(
          700px 500px at 50% 0%,
          rgba(95, 157, 255, 0.13),
          transparent 70%
        );

      z-index: -1;
    }

    .page {
      min-height: 100vh;

      display: flex;
      flex-direction: column;
    }

    .header {
      width: 100%;
      max-width: 1200px;

      margin: 0 auto;
      padding: 32px 36px;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      color: #ffffff;

      font-size: 21px;
      font-weight: 700;

      letter-spacing: -0.055em;
    }

    .header-label {
      color: var(--muted-soft);

      font-size: 10px;
      font-weight: 700;

      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .main {
      flex: 1;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 60px 24px 100px;
    }

    .content {
      width: 100%;
      max-width: 560px;

      text-align: center;
    }

    .avatar {
      width: 86px;
      height: 86px;

      margin: 0 auto 24px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      color: white;

      background:
        linear-gradient(
          135deg,
          var(--blue),
          var(--purple)
        );

      font-size: 34px;
      font-weight: 700;

      box-shadow:
        0 20px 60px
        rgba(92, 119, 255, 0.28);
    }

    h1 {
      margin: 0;

      font-size: clamp(36px, 7vw, 58px);

      line-height: 1;

      font-weight: 700;

      letter-spacing: -0.08em;
    }

    .gradient {
      color: transparent;

      background:
        linear-gradient(
          135deg,
          #ffffff 0%,
          #b8c8ff 45%,
          #79aaff 100%
        );

      -webkit-background-clip: text;
      background-clip: text;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;

      margin-top: 18px;
      padding: 8px 13px;

      border:
        1px solid
        rgba(114, 223, 165, 0.22);

      border-radius: 999px;

      color: var(--success);

      background:
        rgba(114, 223, 165, 0.06);

      font-size: 11px;
      font-weight: 600;
    }

    .status-dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: var(--success);

      box-shadow:
        0 0 12px
        rgba(114, 223, 165, 0.8);
    }

    .profile-card {
      width: 100%;

      margin-top: 36px;

      padding: 24px;

      border:
        1px solid
        var(--border);

      border-radius: 18px;

      background:
        rgba(255, 255, 255, 0.035);

      text-align: left;

      backdrop-filter: blur(18px);
    }

    .info-row {
      padding: 16px 0;

      border-bottom:
        1px solid
        rgba(255, 255, 255, 0.08);
    }

    .info-row:first-child {
      padding-top: 0;
    }

    .info-row:last-child {
      padding-bottom: 0;

      border-bottom: 0;
    }

    .info-label {
      margin-bottom: 7px;

      color: var(--muted-soft);

      font-size: 11px;
      font-weight: 600;

      text-transform: uppercase;

      letter-spacing: 0.08em;
    }

    .info-value {
      color: #ffffff;

      font-size: 16px;
      font-weight: 600;
    }

    .wallet-line {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .wallet-address {
      flex: 1;

      min-width: 0;

      color: #cbd5e3;

      font-family: monospace;
      font-size: 12px;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;
    }

    .copy-button {
      flex-shrink: 0;

      padding: 8px 12px;

      border:
        1px solid
        rgba(255, 255, 255, 0.12);

      border-radius: 9px;

      color: #cbd5e3;

      background:
        rgba(255, 255, 255, 0.06);

      cursor: pointer;

      font-family: inherit;
      font-size: 11px;
    }

    .copy-button:hover {
      background:
        rgba(255, 255, 255, 0.11);
    }

    .disconnect-button {
      width: 100%;

      min-height: 48px;

      margin-top: 18px;

      border:
        1px solid
        rgba(255, 255, 255, 0.12);

      border-radius: 12px;

      color: #cbd5e3;

      background:
        rgba(255, 255, 255, 0.05);

      cursor: pointer;

      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
    }

    .disconnect-button:hover {
      color: white;

      background:
        rgba(255, 255, 255, 0.10);
    }

    .footer {
      padding: 24px;

      color: var(--muted-soft);

      font-size: 11px;

      text-align: center;
    }

    @media (max-width: 600px) {

      .header {
        padding: 24px 20px;
      }

      .header-label {
        display: none;
      }

      .main {
        padding: 45px 18px 70px;
      }

      .profile-card {
        padding: 20px;
      }

      .wallet-line {
        align-items: flex-start;
      }

      .wallet-address {
        white-space: normal;
        word-break: break-all;
      }

    }
  </style>

</head>

<body>

  <div class="page">

```

  </div>

  <script>

    const gramId =
      localStorage.getItem(
        "gramid_username"
      );


    const walletAddress =
      localStorage.getItem(
        "gramid_wallet_address"
      );


    if (!gramId || !walletAddress) {

      window.location.href =
        "./index.html";

    }


    document.getElementById(
      "gram-id"
    ).textContent =
      gramId;


    document.getElementById(
      "gram-id-card"
    ).textContent =
      gramId;


    document.getElementById(
      "wallet-address"
    ).textContent =
      walletAddress;


    const username =
      gramId.replace(
        "@",
        ""
      );


    document.getElementById(
      "avatar"
    ).textContent =
      username
        .charAt(0)
        .toUpperCase();


    const copyButton =
      document.getElementById(
        "copy-button"
      );


    copyButton.addEventListener(

      "click",

      async function() {

        try {

          await navigator.clipboard.writeText(
            walletAddress
          );

          copyButton.textContent =
            "Скопировано";

          setTimeout(

            function() {

              copyButton.textContent =
                "Копировать";

            },

            1500

          );

        } catch (error) {

          copyButton.textContent =
            "Ошибка";

        }

      }

    );


    const tonConnectUI =
      new TON_CONNECT_UI.TonConnectUI({

        manifestUrl:
          "https://gramidcore.github.io/gramid/tonconnect-manifest.json"

      });


    const disconnectButton =
      document.getElementById(
        "disconnect-button"
      );


    disconnectButton.addEventListener(

      "click",

      async function() {

        try {

          await tonConnectUI.disconnect();

        } catch (error) {

          console.error(
            "Disconnect error:",
            error
          );

        }


        localStorage.removeItem(
          "gramid_username"
        );


        localStorage.removeItem(
          "gramid_wallet_address"
        );


        window.location.href =
          "./index.html";

      }

    );

  </script>

</body>
</html>
